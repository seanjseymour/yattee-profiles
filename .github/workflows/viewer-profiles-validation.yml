name: Temporary viewer profiles tests

on:
  push:
    branches:
      - validation/viewer-profiles-b664c786

permissions:
  contents: read

concurrency:
  group: validation-viewer-profiles-b664c786
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/validation/viewer-profiles-b664c786'
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TESTED_SHA: b664c7865683c1e29776497e418762bb0ea7b5a9
    steps:
      - name: Check out pinned feature revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b664c7865683c1e29776497e418762bb0ea7b5a9
          persist-credentials: false

      - name: Verify revision and toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain)"
          test -d "$DEVELOPER_DIR"
          git rev-parse HEAD
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Fx 'Xcode 27.2'
          xcrun swift --version
          echo "HARNESS=$RUNNER_TEMP/viewer-profiles-hostless" >> "$GITHUB_ENV"

      - name: Prepare hostless package with unchanged source and tests
        run: |
          set -euo pipefail
          mkdir -p "$HARNESS/Sources/Yattee" "$HARNESS/Tests/YatteeTests"
          cp Yattee/Models/ViewerProfile.swift "$HARNESS/Sources/Yattee/"
          cp Yattee/Core/ViewerProfilesManager.swift "$HARNESS/Sources/Yattee/"
          cp YatteeTests/ViewerProfilesTests.swift "$HARNESS/Tests/YatteeTests/"
          git show "$TESTED_SHA:Yattee/Models/ViewerProfile.swift" | cmp - "$HARNESS/Sources/Yattee/ViewerProfile.swift"
          git show "$TESTED_SHA:Yattee/Core/ViewerProfilesManager.swift" | cmp - "$HARNESS/Sources/Yattee/ViewerProfilesManager.swift"
          git show "$TESTED_SHA:YatteeTests/ViewerProfilesTests.swift" | cmp - "$HARNESS/Tests/YatteeTests/ViewerProfilesTests.swift"
          shasum -a 256 "$HARNESS/Sources/Yattee/"*.swift "$HARNESS/Tests/YatteeTests/"*.swift
          cat > "$HARNESS/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "ViewerProfilesValidation",
              platforms: [.macOS(.v15)],
              targets: [
                  .target(name: "Yattee"),
                  .testTarget(name: "YatteeTests", dependencies: ["Yattee"])
              ],
              swiftLanguageModes: [.v5]
          )
          SWIFT

      - name: Execute six original Swift Testing cases without app host
        run: |
          set -euo pipefail
          xcrun swift test --package-path "$HARNESS" --filter ViewerProfilesTests \
            2>&1 | tee "$RUNNER_TEMP/viewer-profiles-hostless.log"
          grep -E 'Test run with 6 tests( in [0-9]+ suites?)? passed' "$RUNNER_TEMP/viewer-profiles-hostless.log"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -z "$(git status --porcelain)"
          git show "$TESTED_SHA:Yattee/Models/ViewerProfile.swift" | cmp - "$HARNESS/Sources/Yattee/ViewerProfile.swift"
          git show "$TESTED_SHA:Yattee/Core/ViewerProfilesManager.swift" | cmp - "$HARNESS/Sources/Yattee/ViewerProfilesManager.swift"
          git show "$TESTED_SHA:YatteeTests/ViewerProfilesTests.swift" | cmp - "$HARNESS/Tests/YatteeTests/ViewerProfilesTests.swift"

      - name: Record test scope
        if: always()
        run: |
          {
            echo "Pinned and observed source: $(git rev-parse HEAD)"
            echo "Hostless SwiftPM test harness; unchanged source files and assertions."
            echo "No app-host, tvOS UI, physical-device, signing or release coverage."
            if test -f "$RUNNER_TEMP/viewer-profiles-hostless.log"; then
              grep -E 'Test run with|Test .* (passed|failed)' "$RUNNER_TEMP/viewer-profiles-hostless.log" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
