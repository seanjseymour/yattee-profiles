name: Isolated Intel Search contrast validation
'on':
  push:
    branches: [validation/search-intel-f36884ea]
permissions:
  contents: read
concurrency:
  group: search-intel-f36884ea-validation
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: 7cde9c03c860bc9b64102b517ed47bcebca2e66c
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - name: Verify exact production and initialize evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 4d666f13f4c9883e11fb55260eb0b5c2c68de836
          test "$(uname -m)" = x86_64
          test -d "$DEVELOPER_DIR"
          mkdir -p "$RUNNER_TEMP/integrated-evidence"
          {
            echo "CI_OUTPUT=$RUNNER_TEMP/integrated-evidence"
            echo "DERIVED_DATA=$RUNNER_TEMP/integrated-derived"
            echo "PACKAGE_CACHE=$RUNNER_TEMP/integrated-packages"
          } >> "$GITHUB_ENV"
          { sw_vers; xcodebuild -version; uname -m; git rev-parse HEAD HEAD^{tree}; } | tee "$RUNNER_TEMP/integrated-evidence/toolchain.log"
      - name: Warm simulator tools and prove boot before compile
        id: boot
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -o pipefail
          python3 ../harness/scripts/theme-validation/boot.py 2>&1 | tee "$CI_OUTPUT/boot-gate.log"
      - name: Resolve pinned packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Yattee.xcodeproj -scheme Yattee \
            -destination 'generic/platform=tvOS Simulator' -clonedSourcePackagesDirPath "$PACKAGE_CACHE" \
            -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee "$CI_OUTPUT/packages.log"
          git diff --exit-code -- Yattee.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Verify and overlay only audited fixture deltas
        if: steps.boot.outcome == 'success'
        run: python3 ../harness/scripts/theme-validation/integrated-overlay.py
      - name: Compile corrected integrated source with audited fixtures once
        id: fixture
        if: steps.boot.outcome == 'success'
        run: |
          set -euo pipefail
          xcodebuild build -project Yattee.xcodeproj -scheme Yattee -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE" -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile -resultBundlePath "$CI_OUTPUT/fixture-build.xcresult" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            2>&1 | tee "$CI_OUTPUT/fixture-build.log"
          test "$(lipo -archs "$DERIVED_DATA/Build/Products/Debug-appletvsimulator/Yattee.app/Yattee")" = x86_64
          tar -C "$DERIVED_DATA/Build/Products/Debug-appletvsimulator" -czf "$CI_OUTPUT/integrated-fixture-app.tar.gz" Yattee.app
      - name: Verify simulator remains booted and install
        id: install
        if: steps.fixture.outcome == 'success'
        run: |
          set -euo pipefail
          xcrun simctl io "$TVOS_SIM_UDID" screenshot "$CI_OUTPUT/pre-install.png"
          xcrun simctl install "$TVOS_SIM_UDID" "$DERIVED_DATA/Build/Products/Debug-appletvsimulator/Yattee.app"
      - name: Test Search contrast all four looks and short-long Viewer remote regression
        id: remote
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: harness
        run: bash scripts/theme-validation/remote-tests.sh
      - name: Collect diagnostic evidence
        if: always()
        run: python3 ../harness/scripts/theme-validation/diagnostics.py
      - name: Export actual UI test attachments
        if: always()
        run: |
          for result in theme-remote viewer-focus-ui; do
            if test -d "$CI_OUTPUT/$result.xcresult"; then
              xcrun xcresulttool export attachments --path "$CI_OUTPUT/$result.xcresult" --output-path "$CI_OUTPUT/$result-attachments" || true
            fi
          done
      - name: Record independent outcomes
        if: always()
        run: |
          {
            echo 'Integrated production tree4d666f13f4c9883e11fb55260eb0b5c2c68de836 (localf36884ea).'
            echo 'Boot ${{ steps.boot.outcome }}; fixture ${{ steps.fixture.outcome }}; install ${{ steps.install.outcome }}.'
            echo 'Targeted Search4looks, both focus states, short+long Viewer navigation: ${{ steps.remote.outcome }}.'
            echo 'Unchanged history, Settings/System and unit layers passed in run43846494165; not rerun here.'
            echo 'Search-only one-line fix after972e8aae. This corrected source compiled once with six audited simulator fixture deltas.'
            echo 'Standard macos-26-intel; fresh x86_64 app and UI-test build, no reused arm64 binaries.'
            echo 'Unsigned isolated evidence only. Screenshots require independent actual-render review. No release.'
          } | tee "$CI_OUTPUT/outcomes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Require complete validation coverage
        if: always()
        run: |
          test '${{ steps.boot.outcome }}' = success
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.remote.outcome }}' = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integrated-evidence
          retention-days: 7
