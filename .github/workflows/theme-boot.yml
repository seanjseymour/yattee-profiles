name: Theme alternate runtime boot-only
'on':
  push:
    branches: [validation/horizon-slate-boot-27-0]
permissions:
  contents: read
jobs:
  boot:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          echo "CI_OUTPUT=$RUNNER_TEMP/theme-boot-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/theme-boot-output"
          { sw_vers; xcodebuild -version; uname -m; } | tee "$RUNNER_TEMP/theme-boot-output/toolchain.log"
      - name: Boot explicit alternate pair and retain three screenshots
        run: |
          set -o pipefail
          python3 scripts/theme-validation/boot.py 2>&1 | tee "$CI_OUTPUT/boot-gate.log"
      - name: Collect simulator diagnostics
        if: always()
        run: python3 scripts/theme-validation/diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: theme-boot-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/theme-boot-output
          retention-days: 7
