name: tvOS internal TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused build number (280 or higher)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tvos-internal-testflight
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: tvos-testflight
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number }}
      YATTEE_PROFILES_TEAM: ${{ vars.YATTEE_PROFILES_TEAM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check toolchain and prepare temporary paths
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test -n "$YATTEE_PROFILES_TEAM"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,7}$ ]] && (( BUILD_NUMBER >= 280 ))
          xcodebuild -version
          umask 077
          mkdir -p "$RUNNER_TEMP/yattee-release"
          echo "RELEASE_TEMP=$RUNNER_TEMP/yattee-release" >> "$GITHUB_ENV"

      - name: Resolve pinned dependencies before installing signing credentials
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Yattee.xcodeproj -scheme Yattee \
            -destination 'generic/platform=tvOS' \
            -clonedSourcePackagesDirPath "$RELEASE_TEMP/packages" \
            -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- Yattee.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Install distribution certificate and profiles
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.TVOS_APP_PROFILE_BASE64 }}
          TOPSHELF_PROFILE_BASE64: ${{ secrets.TVOS_TOPSHELF_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RELEASE_TEMP'])
          for name, variable in [('certificate.p12', 'CERTIFICATE_BASE64'),
                                 ('app.mobileprovision', 'APP_PROFILE_BASE64'),
                                 ('topshelf.mobileprovision', 'TOPSHELF_PROFILE_BASE64')]:
              value = os.environ[variable]
              if not value:
                  raise SystemExit('Missing secret: ' + variable)
              (root / name).write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          PY
          security cms -D -i "$RELEASE_TEMP/app.mobileprovision" > "$RELEASE_TEMP/app.plist"
          security cms -D -i "$RELEASE_TEMP/topshelf.mobileprovision" > "$RELEASE_TEMP/topshelf.plist"
          python3 scripts/prepare_tvos_release.py
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RELEASE_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 7200 "$RELEASE_TEMP/signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RELEASE_TEMP/signing.keychain-db"
          security import "$RELEASE_TEMP/certificate.p12" -P "$P12_PASSWORD" \
            -k "$RELEASE_TEMP/signing.keychain-db" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$RELEASE_TEMP/signing.keychain-db" >/dev/null
          # Export signing needs the imported distribution identity in the search list.
          security list-keychains -d user > "$RELEASE_TEMP/original-keychains.txt"
          python3 - <<'PY'
          import os, shlex, subprocess
          from pathlib import Path
          root = Path(os.environ['RELEASE_TEMP'])
          original = shlex.split((root / 'original-keychains.txt').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s',
                          str(root / 'signing.keychain-db'), *original], check=True)
          PY
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$RELEASE_TEMP/app.mobileprovision" "$profile_dir/yattee-ci-app.mobileprovision"
          cp "$RELEASE_TEMP/topshelf.mobileprovision" "$profile_dir/yattee-ci-topshelf.mobileprovision"

      - name: Archive Release for Apple TV
        run: |
          set -euo pipefail
          xcodebuild archive -project Yattee.xcodeproj -scheme Yattee -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RELEASE_TEMP/Yattee.xcarchive" \
            -derivedDataPath "$RELEASE_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RELEASE_TEMP/packages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            "YATTEE_PROFILES_TEAM=$YATTEE_PROFILES_TEAM" "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $RELEASE_TEMP/signing.keychain-db"
          app="$RELEASE_TEMP/Yattee.xcarchive/Products/Applications/Yattee.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = com.seanjseymour.yatteeprofiles
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/PlugIns/YatteeTopShelf.appex/Info.plist")" = com.seanjseymour.yatteeprofiles.TopShelf
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/PlugIns/YatteeTopShelf.appex/Info.plist")" = "$BUILD_NUMBER"

      - name: Upload to internal TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['ASC_KEY_BASE64']
          if not value:
              raise SystemExit('Missing App Store Connect private key secret.')
          Path(os.environ['RELEASE_TEMP'], 'AuthKey.p8').write_bytes(
              base64.b64decode(''.join(value.split()), validate=True))
          PY
          xcodebuild -exportArchive -archivePath "$RELEASE_TEMP/Yattee.xcarchive" \
            -exportPath "$RELEASE_TEMP/export" -exportOptionsPlist "$RELEASE_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RELEASE_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER as internal-only. Verify Apple processing and Apple TV Baseline availability in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os, shlex, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'yattee-release'
          original = root / 'original-keychains.txt'
          if original.exists():
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s',
                              *shlex.split(original.read_text())], check=True)
          keychain = root / 'signing.keychain-db'
          if keychain.exists():
              subprocess.run(['security', 'delete-keychain', str(keychain)], check=True)
          profiles = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          for name in ('yattee-ci-app.mobileprovision', 'yattee-ci-topshelf.mobileprovision'):
              (profiles / name).unlink(missing_ok=True)
          if root.exists():
              shutil.rmtree(root)
          PY
